<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site Insights — Wilson Manuel's Portfolio Hub Metrics">
    <title>{% block title %}Site Insights — Wilson Manuel{% endblock %}</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portfolio.css') }}">

    {% block extra_css %}{% endblock %}

    <!-- Theme Initialization Script -->
    <script>
        (function () {
            const theme = localStorage.getItem('hub-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>

<body>
    <!-- Background effects -->
    <div class="hub-tech-bg">
        <div class="hub-tech-grid"></div>
        <div class="hub-tech-scanline"></div>
        <div class="hub-tech-nodes" id="random-nodes">
            <!-- Nodes will be generated by JS -->
        </div>
    </div>

    <style>
        /* Theme-specific visibility overrides */
        [data-theme="dark"] {
            --hub-cyber-grid: rgba(255, 255, 255, 0.08);
            --hub-cyber-line: rgba(255, 255, 255, 0.15);
        }

        [data-theme="dark"] .hub-node-dynamic::before {
            opacity: 0.8; /* Matches the global design choice */
        }
    </style>

    <script>
        // Spawning system for dynamic technical nodes
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('random-nodes');

            function spawnNode() {
                // Limit max nodes to prevent performance issues
                if (container.children.length > 20) return;

                const node = document.createElement('span');
                node.className = 'hub-node-dynamic';

                const top = Math.random() * 100;
                const left = Math.random() * 100;

                node.style.top = `${top}%`;
                node.style.left = `${left}%`;

                container.appendChild(node);

                // Remove node after animation ends
                setTimeout(() => {
                    node.remove();
                }, 12000);
            }

            // Initial burst
            for (let i = 0; i < 8; i++) {
                setTimeout(spawnNode, Math.random() * 3000);
            }

            // Continuous spawning
            setInterval(() => {
                if (Math.random() > 0.3) { // 70% chance to spawn every interval
                    spawnNode();
                }
            }, 1500);
        });
    </script>

    <!-- Navigation -->
    <header class="hub-header">
        <nav class="hub-nav">
            <a href="{{ url_for('site_insights') }}" class="hub-brand">
                <span style="font-size: 1.2rem;">📊</span> Insights
            </a>

            <div class="hub-nav-links">
                <a href="{{ url_for('portfolio_home') }}" class="hub-link">Back to Portfolio</a>
                <button type="button" class="hub-theme-toggle" id="theme-toggle" title="Toggle Theme">
                    <span class="theme-icon-dark">🌙</span>
                    <span class="theme-icon-light">☀️</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main style="position: relative; z-index: 1;">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer style="position: relative; z-index: 1; padding: 40px 0; border-top: 1px solid var(--hub-border);">
        <div class="hub-container">
            <div
                style="display: flex; justify-content: center; opacity: 0.6; font-size: 0.8rem; font-family: var(--hub-mono);">
                &copy; 2026 Wilson Manuel. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('hub-theme', next);
            });
        }

        // Simple Reveal logic
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('is-visible');
            });
        }, observerOptions);

        document.querySelectorAll('.anim-fade').forEach(el => observer.observe(el));
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
